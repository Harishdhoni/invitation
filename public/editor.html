<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Online Invitation Editor</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Sans+Tamil:wght@400;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Shown when js/firebase-config.js still has placeholder values -->
<section id="setupView" class="center-view" hidden>
  <div class="card narrow">
    <img src="assets/brand/logo.png" alt="HS Invitations" class="logo">
    <h1>Not set up yet</h1>
    <p>This site isn't connected to Firebase yet. Please ask the person who manages it.</p>
  </div>
</section>

<!-- PIN: the only thing this page asks for -->
<section id="pinView" class="center-view" hidden>
  <form id="pinForm" class="card narrow" autocomplete="off">
    <img src="assets/brand/logo.png" alt="HS Invitations" class="logo">
    <h1>Online Invitation Editor</h1>
    <label class="field"><span>Enter your PIN</span>
      <input type="text" id="pinInput" class="pin-input" inputmode="text" autocapitalize="characters" autocorrect="off"
        spellcheck="false" maxlength="12" placeholder="ABCD-EFGH" required autofocus>
    </label>
    <button type="submit" class="btn primary block" id="pinBtn">Open editor</button>
    <p class="error" id="pinError" role="alert"></p>
  </form>
</section>

<!-- EDITOR: one invitation, the one the PIN belongs to. Its markup is built by js/event-editor.js -->
<div id="appView" hidden>
  <!-- Phones and tablets: a bar that scrolls away with the page, with the button that opens the sidebar -->
  <div class="mobilebar">
    <button type="button" class="menu-btn" id="menuBtn" aria-controls="sidebar" aria-expanded="false" aria-label="Open the menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand"><img src="assets/brand/mark.png" alt=""> Online Invitation Editor</div>
  </div>

  <!-- The sidebar: on wide screens always there, folding to a rail of icons with its toggle; on smaller ones a menu that
       slides in. Wired by wireSidebar in js/admin-ui.js. -->
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <div class="side-head">
      <div class="brand"><img src="assets/brand/mark.png" alt=""><span class="brand-name">Online Invitation Editor</span></div>
      <button type="button" class="side-toggle" id="sideToggle" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse the sidebar" title="Collapse the sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15M15.5 9.5 13 12l2.5 2.5"/></svg>
      </button>
      <button type="button" class="side-close" id="menuClose" aria-label="Close the menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="side-label" id="sitePagesLabel">Our pages</p>
    <nav class="side-nav" aria-labelledby="sitePagesLabel">
      <a href="home.html" target="_blank" rel="noopener" title="Our home page: what an invitation website gives you, and how to order one">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5M10 20v-5h4v5"/></svg><span class="side-text">Home page</span><span class="ext" aria-hidden="true">↗</span></a>
      <a href="showcase.html" target="_blank" rel="noopener" title="Every design, with a live preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="side-text">Showcase</span><span class="ext" aria-hidden="true">↗</span></a>
      <button type="button" class="side-share" id="shareOpenBtn" title="Send a friend the link to the home page or the showcase">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="m8.7 10.7 6.6-3.9M8.7 13.3l6.6 3.9"/></svg><span class="side-text">Share</span></button>
    </nav>
    <div class="side-foot">
      <button type="button" class="btn side-out" id="leaveBtn" title="Close the editor in this browser (your PIN still works)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 4H6.5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="m15.5 16 4-4-4-4M19.5 12H9.5"/></svg><span class="side-text">Leave editor</span></button>
      <p class="site-credit side-credit"><span>© 2026</span><span class="sep" aria-hidden="true">✦</span><span>Developed by <b>Harish S</b></span></p>
    </div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>

  <div id="editorView" hidden></div>
</div>

<!-- Under the PIN and setup screens only; once the editor opens the credit is at the foot of the sidebar -->
<footer class="site-credit"><span>© 2026</span><span class="sep" aria-hidden="true">✦</span><span>Developed by <b>Harish S</b></span></footer>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/editor.js"></script>
</body>
</html>
